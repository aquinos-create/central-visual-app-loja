<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Central visual do projeto App da Loja.">
  <title>Central Visual — App da Loja</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <div class="hud-bg" aria-hidden="true">
    <div class="hud-grid"></div>
    <div class="hud-scan"></div>
    <div class="hud-data-stream hud-data-stream--a"></div>
    <div class="hud-data-stream hud-data-stream--b"></div>
    <div class="hud-circuit hud-circuit--a"></div>
    <div class="hud-circuit hud-circuit--b"></div>
    <div class="hud-noise"></div>
    <div class="hud-particles" aria-hidden="true"></div>
  </div>

  <div class="hud-shell" id="hud-shell">
    <header class="topbar hud-frame">
      <div class="topbar__brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <h1>App da Loja</h1>
          <p>Central Visual</p>
        </div>
      </div>

      <div class="topbar__telemetry" aria-hidden="true">
        <span class="telemetry-line"></span>
        <span class="telemetry-pulse"></span>
        <span class="telemetry-line telemetry-line--short"></span>
      </div>

      <div class="topbar__meta" aria-label="Metadados do projeto">
        <span class="meta-chip meta-chip--live"><i></i><strong id="meta-ambiente">DEV</strong></span>
        <span class="meta-chip" id="meta-versao">DEV-0.1.0</span>
        <span class="meta-chip" id="meta-data">05/08/2026</span>
        <button class="meta-chip meta-chip--checkpoint" type="button" id="btn-checkpoint-atual">CP-014</button>
      </div>
    </header>

    <main class="cockpit" aria-label="Visão geral do projeto">
      <aside class="cockpit__left">
        <button class="hud-panel panel-modules hud-frame interactive-panel" type="button" data-open="modules" aria-label="Abrir detalhes dos módulos e estados">
          <div class="panel-heading">
            <span class="panel-icon panel-icon--cube" aria-hidden="true"></span>
            <span>Módulos e estados</span>
            <i class="panel-signal" aria-hidden="true"></i>
          </div>

          <div class="modules-layout">
            <div class="donut-wrap">
              <div class="state-donut" id="state-donut" role="img" aria-label="Distribuição dos estados dos módulos">
                <div class="state-donut__inner">
                  <strong id="total-modulos">13</strong>
                  <span>Módulos</span>
                  <small>totais</small>
                </div>
              </div>
              <div class="donut-base" aria-hidden="true"></div>
            </div>

            <div class="state-counts">
              <div class="state-count state-count--active">
                <i></i><strong id="count-andamento">3</strong><span>Em andamento</span>
              </div>
              <div class="state-count state-count--defined">
                <i></i><strong id="count-definidos">6</strong><span>Definidos / iniciais</span>
              </div>
              <div class="state-count state-count--idle">
                <i></i><strong id="count-nao-iniciados">4</strong><span>Não iniciados</span>
              </div>
            </div>
          </div>

          <div class="panel-corner panel-corner--br" aria-hidden="true"></div>
        </button>

        <button class="hud-panel panel-fronts hud-frame interactive-panel" type="button" data-open="fronts" aria-label="Abrir detalhes das frentes avançadas">
          <div class="panel-heading">
            <span class="panel-icon panel-icon--radar" aria-hidden="true"></span>
            <span>Frentes avançadas</span>
            <i class="panel-signal" aria-hidden="true"></i>
          </div>

          <div class="front-list" id="front-list">
            <div class="front-row">
              <div class="front-row__meta"><span>Consulta de Estoque</span><strong>85%</strong></div>
              <div class="segmented-track"><span style="--value:85%"></span></div>
            </div>
            <div class="front-row">
              <div class="front-row__meta"><span>Fundação técnica</span><strong>80%</strong></div>
              <div class="segmented-track"><span style="--value:80%"></span></div>
            </div>
            <div class="front-row front-row--active">
              <div class="front-row__meta"><span>Atualizar Estoque</span><strong>60%</strong></div>
              <div class="segmented-track"><span style="--value:60%"></span></div>
            </div>
          </div>

          <div class="micro-telemetry" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </button>
      </aside>

      <section class="core-zone" aria-labelledby="core-title">
        <h2 class="sr-only" id="core-title">Núcleo do projeto</h2>

        <div class="core-status-label core-status-label--defined" aria-hidden="true"><i></i><span>Definidos</span></div>
        <div class="core-status-label core-status-label--active" aria-hidden="true"><i></i><span>Em andamento</span></div>
        <div class="core-status-label core-status-label--idle" aria-hidden="true"><i></i><span>Não iniciados</span></div>
        <div class="core-status-label core-status-label--validated" aria-hidden="true"><i></i><span>Validado</span></div>

        <button class="project-core" type="button" data-open="overview" aria-label="Abrir visão geral detalhada do projeto">
          <span class="core-halo core-halo--one" aria-hidden="true"></span>
          <span class="core-halo core-halo--two" aria-hidden="true"></span>
          <span class="core-halo core-halo--three" aria-hidden="true"></span>
          <span class="core-ring core-ring--outer" aria-hidden="true"></span>
          <span class="core-ring core-ring--middle" aria-hidden="true"></span>
          <span class="core-ring core-ring--inner" aria-hidden="true"></span>
          <span class="core-ticks" aria-hidden="true"></span>
          <span class="core-orbit core-orbit--a" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="core-orbit core-orbit--b" aria-hidden="true"><i></i><i></i></span>
          <span class="core-progress" id="core-progress" aria-hidden="true"></span>
          <span class="core-glass" aria-hidden="true"></span>
          <span class="core-energy" aria-hidden="true"></span>
          <span class="core-crosshair" aria-hidden="true"></span>
          <span class="core-readout">
            <small>Projeto em construção</small>
            <strong><span id="core-percent">38</span><em>%</em></strong>
            <span>Progresso geral estimado</span>
            <b id="core-checkpoint">CP-014</b>
          </span>
          <span class="core-scanline" aria-hidden="true"></span>
        </button>

        <div class="core-data-strip" aria-hidden="true">
          <span>SYS/APP-LOJA</span><i></i><span>DATA LINK</span><i></i><span>STATUS NOMINAL</span>
        </div>
      </section>

      <aside class="cockpit__right">
        <button class="hud-panel panel-task hud-frame interactive-panel" type="button" data-open="task" aria-label="Abrir detalhes da tarefa em execução">
          <div class="panel-heading">
            <span class="panel-icon panel-icon--target" aria-hidden="true"></span>
            <span>Tarefa em execução</span>
            <i class="panel-signal panel-signal--orange" aria-hidden="true"></i>
          </div>

          <div class="task-module" id="task-module">Atualizar Estoque</div>
          <div class="task-main">
            <small>Foco atual</small>
            <h3 id="task-title">Favoritos compartilhados</h3>
            <p id="task-block">Persistência no backend</p>
          </div>

          <div class="task-activity" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </button>

        <button class="hud-panel panel-next hud-frame interactive-panel" type="button" data-open="next" aria-label="Abrir todos os próximos passos">
          <div class="panel-heading">
            <span class="panel-icon panel-icon--gear" aria-hidden="true"></span>
            <span>Próximos passos</span>
            <i class="panel-signal" aria-hidden="true"></i>
          </div>

          <ol class="next-list" id="next-list">
            <li><b>01</b><span>Favoritos compartilhados</span><i>›</i></li>
            <li><b>02</b><span>Proteção com uma Reserva real</span><i>›</i></li>
            <li><b>03</b><span>Alertas e detalhes</span><i>›</i></li>
          </ol>

          <div class="data-pulse" aria-hidden="true"><span></span></div>
        </button>
      </aside>
    </main>

    <section class="bottom-grid" aria-label="Indicadores complementares">
      <button class="hud-panel bottom-panel panel-timeline hud-frame interactive-panel" type="button" data-open="timeline" aria-label="Abrir linha do tempo completa dos checkpoints">
        <div class="panel-heading panel-heading--compact">
          <span class="panel-icon panel-icon--timeline" aria-hidden="true"></span>
          <span>Linha do tempo de checkpoints</span>
          <i class="panel-signal" aria-hidden="true"></i>
        </div>

        <div class="mini-timeline" id="mini-timeline" aria-hidden="true"></div>
        <div class="timeline-legend" aria-hidden="true">
          <span><i class="legend-dot legend-dot--valid"></i>Validado</span>
          <span><i class="legend-dot legend-dot--defined"></i>Definido</span>
          <span><i class="legend-dot legend-dot--discarded"></i>Descartado</span>
          <span><i class="legend-dot legend-dot--current"></i>Atual</span>
        </div>
      </button>

      <button class="hud-panel bottom-panel panel-summary hud-frame interactive-panel" type="button" data-open="modules" aria-label="Abrir resumo completo dos módulos">
        <div class="panel-heading panel-heading--compact">
          <span class="panel-icon panel-icon--layers" aria-hidden="true"></span>
          <span>Resumo de módulos</span>
          <i class="panel-signal" aria-hidden="true"></i>
        </div>

        <div class="summary-metrics">
          <div class="summary-metric summary-metric--total"><i></i><strong id="summary-total">13</strong><span>Total</span></div>
          <div class="summary-metric summary-metric--active"><i></i><strong id="summary-active">3</strong><span>Em andamento</span></div>
          <div class="summary-metric summary-metric--defined"><i></i><strong id="summary-defined">6</strong><span>Definidos</span></div>
          <div class="summary-metric summary-metric--idle"><i></i><strong id="summary-idle">4</strong><span>Não iniciados</span></div>
        </div>
      </button>

      <button class="hud-panel bottom-panel panel-priority hud-frame interactive-panel" type="button" data-open="next" aria-label="Abrir prioridades dos próximos blocos">
        <div class="panel-heading panel-heading--compact">
          <span class="panel-icon panel-icon--priority" aria-hidden="true"></span>
          <span>Próximos blocos</span>
          <i class="panel-signal panel-signal--orange" aria-hidden="true"></i>
        </div>

        <div class="priority-list" id="priority-list">
          <div class="priority-row priority-row--high">
            <span><b>Favoritos</b><small>Prioridade alta</small></span>
            <div class="priority-segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="priority-row priority-row--high">
            <span><b>Reserva real</b><small>Prioridade alta</small></span>
            <div class="priority-segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="priority-row priority-row--medium">
            <span><b>Alertas e detalhes</b><small>Prioridade média</small></span>
            <div class="priority-segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </button>
    </section>

    <footer class="statusbar hud-frame">
      <div class="statusbar__left" aria-hidden="true">
        <span class="status-led status-led--on"></span>
        <span class="status-led status-led--on"></span>
        <span class="status-led"></span>
        <span class="status-led"></span>
      </div>
      <p id="status-note">Percentuais são estimativas de acompanhamento e podem variar.</p>
      <div class="statusbar__right" aria-hidden="true">
        <span class="packet"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="mini-bars"><i></i><i></i><i></i><i></i></span>
      </div>
    </footer>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="hud-modal hud-frame" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="hud-modal__header">
        <div>
          <p>Central Visual · Detalhamento</p>
          <h2 id="modal-title">Detalhes</h2>
        </div>
        <button class="modal-close" type="button" id="modal-close" aria-label="Fechar detalhes">×</button>
      </header>
      <div class="hud-modal__body" id="modal-body"></div>
      <footer class="hud-modal__footer">
        <span>Fonte: documentação oficial do projeto</span>
        <button type="button" id="modal-close-footer">Fechar</button>
      </footer>
    </section>
  </div>

  <noscript>
    <div class="noscript">Ative o JavaScript para carregar os dados do progresso.json.</div>
  </noscript>
</body>
</html>
